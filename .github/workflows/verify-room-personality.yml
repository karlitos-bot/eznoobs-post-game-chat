name: Verify room personality pass

on:
  push:
    branches:
      - fix/room-personality-fonts

jobs:
  verify-focused-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check focused formatting
        run: >-
          npx prettier --check
          src/styles.css
          src/components/eznoobs/LobbyPersonalityLayer.tsx
          src/components/eznoobs/RoomClarityLayer.tsx
          src/components/eznoobs/room-clarity.css
      - name: Lint focused TypeScript
        run: >-
          npx eslint
          src/components/eznoobs/LobbyPersonalityLayer.tsx
          src/components/eznoobs/RoomClarityLayer.tsx
      - name: Production build
        run: npm run build
