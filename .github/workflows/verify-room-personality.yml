name: Verify room personality pass

on:
  push:
    branches:
      - fix/room-personality-fonts

permissions:
  contents: write

jobs:
  verify-focused-change:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check focused formatting
        run: >-
          npx prettier --check
          src/styles.css
          src/components/eznoobs/LobbyPersonalityLayer.tsx
          src/components/eznoobs/RoomClarityLayer.tsx
          src/components/eznoobs/room-clarity.css
      - name: Lint focused TypeScript
        run: >-
          npx eslint
          src/components/eznoobs/LobbyPersonalityLayer.tsx
          src/components/eznoobs/RoomClarityLayer.tsx
      - name: Production build
        run: npm run build
      - name: Record successful verification
        shell: bash
        run: |
          mkdir -p .verification
          printf 'focused-format=pass\nfocused-eslint=pass\nproduction-build=pass\n' > .verification/room-personality-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .verification/room-personality-ok.txt
          git commit -m "CI: record room personality verification"
          git push origin HEAD:fix/room-personality-fonts
