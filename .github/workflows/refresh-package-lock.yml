name: Refresh package lock

on:
  push:
    branches:
      - fix/room-personality-fonts

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/room-personality-fonts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "Build: refresh npm lockfile for local fonts"
          git push origin HEAD:fix/room-personality-fonts
