name: Format room personality pass

on:
  push:
    branches:
      - fix/room-personality-fonts

permissions:
  contents: write

jobs:
  format-focused-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/room-personality-fonts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format only this feature's source files
        run: >-
          npx prettier --write
          src/styles.css
          src/components/eznoobs/LobbyPersonalityLayer.tsx
          src/components/eznoobs/RoomClarityLayer.tsx
          src/components/eznoobs/room-clarity.css
      - name: Commit focused formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- src/styles.css src/components/eznoobs/LobbyPersonalityLayer.tsx src/components/eznoobs/RoomClarityLayer.tsx src/components/eznoobs/room-clarity.css; then
            echo "Focused files are already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/styles.css src/components/eznoobs/LobbyPersonalityLayer.tsx src/components/eznoobs/RoomClarityLayer.tsx src/components/eznoobs/room-clarity.css
          git commit -m "Style: format room personality pass"
          git push origin HEAD:fix/room-personality-fonts
